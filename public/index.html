  <!DOCTYPE html>                                                               
  <html>                                                                        
  <head>                                                                        
      <title>Aesthetic Chat 🎀</title>                                          
      <style>                                                                   
          :root {                                                               
              --bg: #fdf6f0; --accent: #ffc0cb; --text: #5d5d5d;                
          }                                                                     
          body { background: var(--bg); font-family: 'Segoe UI', sans-serif;    
display: flex; height: 100vh; margin: 0; }                                      
          #sidebar { width: 250px; background: #fff; border-right: 4px solid    
var(--accent); padding: 20px; display: flex; flex-direction: column; }          
          #chat-area { flex: 1; display: flex; flex-direction: column; }        
          #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex;  
flex-direction: column; gap: 10px; }                                            
          .msg { padding: 10px; border-radius: 15px; background: white;         
max-width: 70%; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }                       
          #input-area { padding: 20px; background: white; border-top: 4px solid 
var(--accent); display: flex; gap: 10px; }                                      
          input { padding: 10px; border-radius: 10px; border: 1px solid #ddd;   
flex: 1; outline: none; }                                                       
          button { background: var(--accent); border: none; padding: 10px 20px; 
border-radius: 10px; cursor: pointer; font-weight: bold; color: white; }        
          .channel-btn { background: none; border: 1px solid var(--accent);     
color: var(--text); margin: 5px 0; text-align: left; padding: 10px;             
border-radius: 10px; cursor: pointer; }                                         
          .channel-btn:hover { background: var(--accent); color: white; }       
          #login-screen { position: fixed; inset: 0; background: var(--bg);     
display: flex; align-items: center; justify-content: center; z-index: 100; }    
          .login-box { background: white; padding: 40px; border-radius: 30px;   
border: 4px solid var(--accent); text-align: center; }                          
      </style>                                                                  
  </head>                                                                       
  <body>                                                                        
      <div id="login-screen">                                                   
          <div class="login-box">                                               
              <h1>Welcome Bestie! 🎀</h1>                                       
              <input type="text" id="username" placeholder="Your                
name..."><br><br>                                                               
              <button onclick="joinChat()">Enter Chat ✨</button>               
          </div>                                                                
      </div>                                                                    
                                                                                
      <div id="sidebar">                                                        
          <h2>Channels 📂</h2>                                                  
          <button class="channel-btn" onclick="changeChannel('general')">#      
general</button>                                                                
          <button class="channel-btn" onclick="changeChannel('toca-boca')">#    
toca-boca</button>                                                              
          <button class="channel-btn" onclick="changeChannel('gaming')">#       
gaming</button>                                                                 
      </div>                                                                    
                                                                                
      <div id="chat-area">                                                      
          <div id="messages"></div>                                             
          <div id="input-area">                                                 
              <input type="text" id="msg-input" placeholder="Type a message...">
              <button onclick="sendMessage()">Send 🚀</button>                  
          </div>                                                                
      </div>                                                                    
                                                                                
      <script src="/socket.io/socket.io.js"></script>                           
      <script>                                                                  
          const socket = io();                                                  
          let myUsername = '';                                                  
          let currentChannel = 'general';                                       
                                                                                
          function joinChat() {                                                 
              myUsername = document.getElementById('username').value;           
              if (myUsername) {                                                 
                  document.getElementById('login-screen').style.display =       
'none';                                                                         
                  socket.emit('join', { username: myUsername, channel:          
currentChannel });                                                              
              }                                                                 
          }                                                                     
                                                                                
          function sendMessage() {                                              
              const input = document.getElementById('msg-input');               
              if (input.value) {                                                
                  socket.emit('send_message', {                                 
                      channel: currentChannel,                                  
                      text: input.value,                                        
                      username: myUsername,                                     
                      color: '#ffc0cb'                                          
                  });                                                           
                  input.value = '';                                             
              }                                                                 
          }                                                                     
                                                                                
          function changeChannel(chan) {                                        
              const old = currentChannel;                                       
              currentChannel = chan;                                            
              socket.emit('change_channel', { username: myUsername, oldChannel: 
old, newChannel: chan });                                                       
              document.getElementById('messages').innerHTML = '';               
          }                                                                     
                                                                                
          socket.on('message', (data) => {                                      
              const div = document.createElement('div');                        
              div.className = 'msg';                                            
              div.innerHTML = `<strong>${data.user}</strong>: ${data.text}`;    
              div.style.borderColor = data.color;                               
              document.getElementById('messages').appendChild(div);             
              const mDiv = document.getElementById('messages');                 
              mDiv.scrollTop = mDiv.scrollHeight;                               
          });                                                                   
      </script>                                                                 
  </body>                                                                       
  </html>
